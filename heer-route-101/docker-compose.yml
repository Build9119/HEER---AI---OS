services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: heer
      POSTGRES_PASSWORD: heer_dev_only
      POSTGRES_DB: heer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heer"]
      interval: 5s
      timeout: 5s
      retries: 5

  opa:
    image: openpolicyagent/opa:latest-debug
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--diagnostic-addr=0.0.0.0:8182", "/policies"]
    ports:
      - "8181:8181"
      - "8182:8182"
    volumes:
      - ./policies:/policies
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8182/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  pgdata:
    name: pgdata
